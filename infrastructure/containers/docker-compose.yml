# n8n Automation Platform
# Deployed via GitHub Actions to Azure VM

services:
  # ============================================================================
  # n8n Service
  # ============================================================================
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    container_name: n8n
    restart: unless-stopped
    
    environment:
      # Basic Configuration
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      
      # Webhook Configuration
      - WEBHOOK_URL=https://${N8N_HOST}/
      
      # Security
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      
      # Execution Settings
      - EXECUTIONS_PROCESS=main
      - EXECUTIONS_MODE=regular
      - EXECUTIONS_TIMEOUT=300
      - EXECUTIONS_TIMEOUT_MAX=3600
      
      # Data Retention
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      
      # Performance
      - N8N_PAYLOAD_SIZE_MAX=16
      - N8N_METRICS=false
      - N8N_DIAGNOSTICS_ENABLED=false
      
      # Timezone
      - GENERIC_TIMEZONE=UTC
      - TZ=UTC
      
      # Logging
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=console,file
      - N8N_LOG_FILE_LOCATION=/home/node/.n8n/logs/
      
      # Optional: External Database (PostgreSQL)
      # - DB_TYPE=postgresdb
      # - DB_POSTGRESDB_HOST=postgres
      # - DB_POSTGRESDB_PORT=5432
      # - DB_POSTGRESDB_DATABASE=n8n
      # - DB_POSTGRESDB_USER=n8n
      # - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    
    volumes:
      # Persistent data
      - n8n_data:/home/node/.n8n
      # Optional: Custom nodes
      # - ./n8n/custom-nodes:/home/node/.n8n/custom
      # Optional: Local files for workflows
      # - ./n8n/files:/files
    
    networks:
      - n8n-network
    
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    labels:
      - "com.n8n.description=n8n Workflow Automation"
      - "com.n8n.version=${N8N_VERSION:-latest}"
    
    # Resource limits (adjust based on workload)
    deploy:
      resources:
        limits:
          #cpus: '2.0'
          memory: 2G
        reservations:
          #cpus: '0.5'
          memory: 512M
  
  # ============================================================================
  # Caddy Reverse Proxy
  # ============================================================================
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    
    env_file:
      - ./caddy/.env

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 support
    
    volumes:
      # Caddy configuration
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Persistent data (certificates, etc.)
      - caddy_data:/data
      - caddy_config:/config
      # Access logs
      - caddy_logs:/var/log/caddy
    
    networks:
      - n8n-network
    
    depends_on:
      n8n:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2019/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    labels:
      - "com.caddy.description=Reverse Proxy for n8n"
  
  # ============================================================================
  # PostgreSQL Database (Optional - for production)
  # ============================================================================
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: n8n-postgres
  #   restart: unless-stopped
  #   
  #   environment:
  #     - POSTGRES_USER=n8n
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  #     - POSTGRES_DB=n8n
  #   
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   
  #   networks:
  #     - n8n-network
  #   
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U n8n"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

# ============================================================================
# Networks
# ============================================================================
networks:
  n8n-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================================
# Volumes
# ============================================================================
volumes:
  n8n_data:
    driver: local
    labels:
      - "com.n8n.volume=data"
  
  caddy_data:
    driver: local
    labels:
      - "com.caddy.volume=data"
  
  caddy_config:
    driver: local
    labels:
      - "com.caddy.volume=config"
  
  caddy_logs:
    driver: local
    labels:
      - "com.caddy.volume=logs"
  
  # postgres_data:
  #   driver: local
  #   labels:
  #     - "com.postgres.volume=data"
