package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - jq
  - sqlite3

write_files:
  # Docker Compose configuration
  - path: /opt/n8n/docker-compose.yml
    encoding: b64
    content: {{DOCKER_COMPOSE_B64}}
    permissions: '0644'
  
  # Caddyfile configuration
  - path: /opt/n8n/caddy/Caddyfile
    encoding: b64
    content: {{CADDYFILE_B64}}
    permissions: '0644'
  
  # Environment file
  - path: /opt/n8n/.env
    content: |
      N8N_HOST={{DOMAIN_NAME}}
      N8N_VERSION={{N8N_VERSION}}
      N8N_ENCRYPTION_KEY={{ENCRYPTION_KEY}}
      TLS_EMAIL=admin@{{DOMAIN_NAME}}
    permissions: '0600'
  
  # Deployment script
  - path: /opt/n8n/scripts/deploy.sh
    encoding: b64
    content: {{DEPLOY_SCRIPT_B64}}
    permissions: '0755'
  
  # Backup script
  - path: /opt/n8n/scripts/backup.sh
    encoding: b64
    content: {{BACKUP_SCRIPT_B64}}
    permissions: '0755'
  
  # Health check script
  - path: /opt/n8n/scripts/health-check.sh
    encoding: b64
    content: {{HEALTH_SCRIPT_B64}}
    permissions: '0755'

runcmd:
  - echo "Starting n8n deployment at $(date)"
  
  # Install Docker
  - curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
  - sh /tmp/get-docker.sh
  - usermod -aG docker {{ADMIN_USERNAME}}
  - systemctl enable docker
  - systemctl start docker
  
  # Install Docker Compose
  - mkdir -p /usr/local/lib/docker/cli-plugins
  - curl -SL https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
  - chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
  
  # Create directory structure
  - mkdir -p /opt/n8n/{caddy,n8n,backups,scripts}
  - mkdir -p /var/log/{n8n,caddy}
  - chown -R {{ADMIN_USERNAME}}:{{ADMIN_USERNAME}} /opt/n8n
  
  # Run deployment script
  - /opt/n8n/scripts/deploy.sh
  
  # Setup automatic updates
  - apt-get install -y unattended-upgrades
  - dpkg-reconfigure -plow unattended-upgrades
  
  # Setup backup cron job (daily at 2 AM)
  - echo "0 2 * * * /opt/n8n/scripts/backup.sh >> /var/log/n8n/backup.log 2>&1" | crontab -u {{ADMIN_USERNAME}} -
  
  # Setup health check cron job (every 5 minutes)
  - echo "*/5 * * * * /opt/n8n/scripts/health-check.sh >> /var/log/n8n/health.log 2>&1" | crontab -u {{ADMIN_USERNAME}} -
  
  # Create deployment status
  - echo "Deployment completed at $(date)" > /opt/n8n/deployment-status.txt
  - echo "Domain: {{DOMAIN_NAME}}" >> /opt/n8n/deployment-status.txt
  - echo "n8n Version: {{N8N_VERSION}}" >> /opt/n8n/deployment-status.txt
  
  - echo "n8n deployment complete!"

final_message: "n8n is ready! Access at https://{{DOMAIN_NAME}}"