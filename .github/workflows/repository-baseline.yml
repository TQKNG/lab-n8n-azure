name: Repository baseline

on:
  pull_request:
    paths:
      - 'README.md'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/copilot-instructions.md'
      - '.github/pull_request_template.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/repository-baseline.yml'
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/copilot-instructions.md'
      - '.github/pull_request_template.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/repository-baseline.yml'

permissions:
  contents: read

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check foundation files
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md LICENSE CONTRIBUTING.md AGENTS.md CLAUDE.md .github/copilot-instructions.md .github/pull_request_template.md .github/ISSUE_TEMPLATE/bug_report.md .github/ISSUE_TEMPLATE/feature_request.md; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
          if grep -R -n '{{[A-Z_]*}}' README.md CONTRIBUTING.md AGENTS.md CLAUDE.md .github/copilot-instructions.md .github/pull_request_template.md .github/ISSUE_TEMPLATE; then
            echo 'Unresolved scaffold placeholders found.'
            exit 1
          fi
